name: Build Medalist HTML

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run build script
        run: python scripts/build_medalists.py
        working-directory: .

      - name: Verify generated content
        run: |
          python - <<'PY'
          from pathlib import Path

          def verify_file(path, label):
              content = Path(path).read_text(encoding="utf-8")
              begin = f"<!-- BEGIN {label} -->"
              end = f"<!-- END {label} -->"

              if content.count(begin) != 1 or content.count(end) != 1:
                  raise SystemExit(f"{path}: missing or duplicate markers")

              start = content.index(begin) + len(begin)
              stop = content.index(end)
              if start > stop or "<li>" not in content[start:stop]:
                  raise SystemExit(f"{path}: markers out of order or generated list is empty")

          verify_file("index.html", "GENERATED LATEST MEDALISTS")
          verify_file("medalists.html", "GENERATED MEDALISTS")
          PY

      - name: Upload generated files as artifact
        uses: actions/upload-artifact@v7
        with:
          name: medalist-html
          path: |
            index.html
            medalists.html
          if-no-files-found: error